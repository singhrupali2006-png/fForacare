name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ]; then flutter create --project-name floracare --org com.floracare .; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
