<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Device Frame Outer -->
  <rect x="5" y="5" width="370" height="750" rx="42" fill="#1e1e1e" filter="url(#phoneShadow)"/>
  <rect x="7" y="7" width="366" height="746" rx="40" fill="none" stroke="#333333" stroke-width="2.5"/>

  <!-- Screen Canvas -->
  <g clip-path="url(#screenClip)">
    <clipPath id="screenClip">
      <rect x="13" y="13" width="354" height="734" rx="34"/>
    </clipPath>

    <!-- App Background -->
    <rect x="13" y="13" width="354" height="734" fill="#FBFDF8"/>

    <!-- Status Bar -->
    <g transform="translate(13, 13)">
      <circle cx="177" cy="14" r="5" fill="#111111"/>
      <text x="32" y="18" class="font" font-size="12" font-weight="600" fill="#1B1C18">9:41</text>
      <g transform="translate(300, 8)" fill="#1B1C18">
        <path d="M1 8h2v3H1zm4-3h2v6H5zm4-3h2v9H9zm4-2h2v11h-2z"/>
        <path d="M22 2a11 11 0 00-7.8 3.2l7.8 9.5 7.8-9.5A11 11 0 0022 2z" transform="scale(0.8) translate(8, 0)"/>
        <rect x="30" y="3" width="16" height="8" rx="2" fill="none" stroke="#1B1C18" stroke-width="1.2"/>
        <rect x="32" y="5" width="11" height="4" rx="1" fill="#1B1C18"/>
        <path d="M47 5.5v3" stroke="#1B1C18" stroke-width="1.2"/>
      </g>
    </g>

    <!-- App Bar with Back, Title -->
    <g transform="translate(13, 46)">
      <path d="M26 27l6-6M26 27l6 6M26 27h16" stroke="#1B1C18" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="32" class="font" font-size="18" font-weight="700" fill="#1B1C18">Add plant</text>
    </g>

    <!-- Form Container -->
    <g transform="translate(30, 110)">

      <!-- Field 1: Plant Name -->
      <g transform="translate(0, 0)">
        <rect width="320" height="54" rx="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
        <text x="14" y="-4" class="font" font-size="11" font-weight="600" fill="#2E7D32">Plant name *</text>
        <path d="M24 20c-3 0-5 2.5-5 5.5 0 4 5 8.5 5 8.5s5-4.5 5-8.5c0-3-2-5.5-5-5.5z" fill="#2E7D32"/>
        <text x="44" y="33" class="font" font-size="15" fill="#1B1C18">Golden Pothos</text>
      </g>

      <!-- Field 2: Species -->
      <g transform="translate(0, 68)">
        <rect width="320" height="54" rx="14" fill="#FFFFFF" stroke="#C4C8BA" stroke-width="1"/>
        <path d="M20 34a3 3 0 016 0M23 23v6" stroke="#74796E" stroke-width="1.6" fill="none"/>
        <text x="44" y="33" class="font" font-size="14.5" fill="#1B1C18">Epipremnum aureum</text>
        <text x="44" y="16" class="font" font-size="10.5" fill="#74796E">Species (optional)</text>
      </g>

      <!-- Field 3: Location -->
      <g transform="translate(0, 136)">
        <rect width="320" height="54" rx="14" fill="#FFFFFF" stroke="#C4C8BA" stroke-width="1"/>
        <path d="M23 21a4 4 0 00-4 4c0 3 4 7 4 7s4-4 4-7a4 4 0 00-4-4zm0 5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z" fill="#74796E"/>
        <text x="44" y="33" class="font" font-size="14.5" fill="#1B1C18">Bedroom Bookshelf</text>
        <text x="44" y="16" class="font" font-size="10.5" fill="#74796E">Location (optional)</text>
      </g>

      <!-- Field 4: Sunlight Dropdown -->
      <g transform="translate(0, 204)">
        <rect width="320" height="54" rx="14" fill="#FFFFFF" stroke="#C4C8BA" stroke-width="1"/>
        <circle cx="23" cy="27" r="3.5" fill="none" stroke="#74796E" stroke-width="1.6"/>
        <path d="M23 21v1.5M23 31v1.5M17 27h1.5M27.5 27h1.5" stroke="#74796E" stroke-width="1.6"/>
        <text x="44" y="33" class="font" font-size="14.5" fill="#1B1C18">Medium light</text>
        <text x="44" y="16" class="font" font-size="10.5" fill="#74796E">Sunlight</text>
        <!-- Arrow down -->
        <path d="M295 24l4 4 4-4" stroke="#74796E" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Field 5: Watering Slider -->
      <g transform="translate(0, 276)">
        <text x="4" y="14" class="font" font-size="14" font-weight="600" fill="#1B1C18">Water every 8 days</text>
        <!-- Slider Track background -->
        <rect x="4" y="28" width="312" height="6" rx="3" fill="#D8E7D7"/>
        <!-- Active track -->
        <rect x="4" y="28" width="85" height="6" rx="3" fill="#2E7D32"/>
        <!-- Thumb -->
        <circle cx="89" cy="31" r="10" fill="#2E7D32"/>
        <circle cx="89" cy="31" r="4" fill="#FFFFFF"/>
        <!-- Min and max labels -->
        <text x="4" y="52" class="font" font-size="11" fill="#74796E">1 day</text>
        <text x="316" y="52" class="font" font-size="11" fill="#74796E" text-anchor="end">30 days</text>
      </g>

      <!-- Field 6: Last Watered Picker -->
      <g transform="translate(0, 344)">
        <rect width="320" height="52" rx="14" fill="#F0F5EE"/>
        <rect x="14" y="16" width="16" height="16" rx="2" stroke="#2E7D32" stroke-width="1.6" fill="none"/>
        <line x1="14" y1="21" x2="30" y2="21" stroke="#2E7D32" stroke-width="1.5"/>
        <text x="42" y="25" class="font" font-size="11" fill="#74796E">Last watered</text>
        <text x="42" y="41" class="font" font-size="14" font-weight="600" fill="#1B1C18">Nov 3, 2026</text>
        <path d="M290 22l6 6M296 22l-6 6" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Field 7: Notes -->
      <g transform="translate(0, 412)">
        <rect width="320" height="74" rx="14" fill="#FFFFFF" stroke="#C4C8BA" stroke-width="1"/>
        <text x="14" y="24" class="font" font-size="13" fill="#1B1C18">Tolerates low light; water when top inch of soil feels dry.</text>
        <text x="14" y="-4" class="font" font-size="11" fill="#74796E">Notes (optional)</text>
      </g>

      <!-- Submit Button -->
      <g transform="translate(0, 510)">
        <rect width="320" height="52" rx="26" fill="#2E7D32"/>
        <g transform="translate(108, 16)">
          <path d="M4 10l4 4 8-8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <text x="24" y="14" class="font" font-size="15" font-weight="600" fill="#FFFFFF">Add plant</text>
        </g>
      </g>

    </g>

  </g>
</svg>
