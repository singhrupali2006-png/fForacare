<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143e1d" />
      <stop offset="50%" stop-color="#1f5f2e" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="260" rx="20" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="780" cy="40" r="140" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="720" cy="220" r="100" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="70" cy="220" r="80" fill="#ffffff" fill-opacity="0.04" />

  <!-- Logo and Content -->
  <g transform="translate(48, 42)">
    <!-- App Icon Emblem -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="#ffffff" filter="url(#shadow)"/>
    <g transform="translate(16, 16)">
      <!-- Leaf icon -->
      <path d="M24 4C14 4 6 12 6 22c0 12 18 22 18 22s18-10 18-22c0-10-8-18-18-18zm0 36c-5-5-14-12.2-14-18 0-7.7 6.3-14 14-14s14 6.3 14 14c0 5.8-9 13-14 18z" fill="#2e7d32"/>
      <path d="M24 10c0 10-6 16-10 18" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M24 16c4 4 8 6 10 7" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Title & Subtitle -->
    <text x="100" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">FloraCare</text>
    <text x="100" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c8e6c9">Smart Houseplant Care &amp; Watering Schedule Tracker</text>

    <!-- Description -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e8f5e9" opacity="0.92">
      Built with Flutter (Material 3) • Local Offline Storage • Light &amp; Dark Theme Support
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 142)">
      <!-- Badge 1: Flutter -->
      <rect x="0" y="0" width="105" height="30" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="52" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">⚡ Flutter 3</text>

      <!-- Badge 2: Material 3 -->
      <rect x="115" y="0" width="115" height="30" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="172" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">🎨 Material 3</text>

      <!-- Badge 3: Offline First -->
      <rect x="240" y="0" width="125" height="30" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="302" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">💾 100% Offline</text>

      <!-- Badge 4: Provider State -->
      <rect x="375" y="0" width="135" height="30" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="442" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">🔄 Provider State</text>

      <!-- Badge 5: Dark & Light -->
      <rect x="520" y="0" width="130" height="30" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="585" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">🌓 Dual Themes</text>

      <!-- Badge 6: Tested -->
      <rect x="660" y="0" width="100" height="30" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="710" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">✓ Unit Tested</text>
    </g>
  </g>
</svg>
