<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="phoneShadowDark" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Device Frame Outer -->
  <rect x="5" y="5" width="370" height="750" rx="42" fill="#0d0d0d" filter="url(#phoneShadowDark)"/>
  <rect x="7" y="7" width="366" height="746" rx="40" fill="none" stroke="#252525" stroke-width="2.5"/>

  <!-- Screen Canvas -->
  <g clip-path="url(#screenClipDark)">
    <clipPath id="screenClipDark">
      <rect x="13" y="13" width="354" height="734" rx="34"/>
    </clipPath>

    <!-- App Background (Dark Mode) -->
    <rect x="13" y="13" width="354" height="734" fill="#121411"/>

    <!-- Status Bar -->
    <g transform="translate(13, 13)">
      <circle cx="177" cy="14" r="5" fill="#000000"/>
      <text x="32" y="18" class="font" font-size="12" font-weight="600" fill="#E2E3DC">9:41</text>
      <g transform="translate(300, 8)" fill="#E2E3DC">
        <path d="M1 8h2v3H1zm4-3h2v6H5zm4-3h2v9H9zm4-2h2v11h-2z"/>
        <path d="M22 2a11 11 0 00-7.8 3.2l7.8 9.5 7.8-9.5A11 11 0 0022 2z" transform="scale(0.8) translate(8, 0)"/>
        <rect x="30" y="3" width="16" height="8" rx="2" fill="none" stroke="#E2E3DC" stroke-width="1.2"/>
        <rect x="32" y="5" width="11" height="4" rx="1" fill="#E2E3DC"/>
        <path d="M47 5.5v3" stroke="#E2E3DC" stroke-width="1.2"/>
      </g>
    </g>

    <!-- App Bar -->
    <g transform="translate(13, 46)">
      <rect x="0" y="0" width="354" height="54" fill="#121411"/>
      <g transform="translate(18, 14)">
        <path d="M12 2C6.5 2 2 6.5 2 12c0 6.6 10 12 10 12s10-5.4 10-12c0-5.5-4.5-10-10-10zm0 19.5C9.2 18.7 4 14.7 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8c0 2.7-5.2 6.7-8 9.5z" fill="#83D98A"/>
        <path d="M12 5v10M12 9l-3 3M12 11l3 3" stroke="#83D98A" stroke-width="1.5" stroke-linecap="round"/>
        <text x="30" y="18" class="font" font-size="20" font-weight="700" fill="#E2E3DC">FloraCare</text>
      </g>
      <circle cx="324" cy="27" r="16" fill="#1F241E"/>
      <path d="M324 20a7 7 0 000 14V20z" fill="#E2E3DC"/>
      <circle cx="324" cy="27" r="7" fill="none" stroke="#E2E3DC" stroke-width="1.5"/>
    </g>

    <!-- Alert / Thirsty header -->
    <text x="32" y="124" class="font" font-size="16" font-weight="600" fill="#FFB4AB">2 plants need water</text>

    <!-- Card 1 (Dark Mode) -->
    <g transform="translate(25, 140)">
      <rect width="330" height="92" rx="18" fill="#1D221C"/>
      <circle cx="36" cy="46" r="24" fill="#4B1210"/>
      <path d="M36 34c-4.4 0-8 3.6-8 8 0 5.5 8 11 8 11s8-5.5 8-11c0-4.4-3.6-8-8-8z" fill="#FFB4AB"/>
      <text x="72" y="38" class="font" font-size="15" font-weight="700" fill="#E2E3DC">Monstera Deliciosa</text>
      <text x="72" y="55" class="font" font-size="12" fill="#939A8E">Living Room • Swiss Cheese</text>
      <g transform="translate(72, 64)">
        <path d="M4 1C4 1 0 5.5 0 8a4 4 0 008 0c0-2.5-4-7-4-7z" fill="#FFB4AB"/>
        <text x="14" y="9" class="font" font-size="12" font-weight="600" fill="#FFB4AB">Water today</text>
      </g>
      <circle cx="294" cy="46" r="18" fill="#283525"/>
      <path d="M294 39c0 0-4 4.8-4 7.2a4 4 0 008 0c0-2.4-4-7.2-4-7.2z" fill="#83D98A"/>
    </g>

    <!-- Card 2 (Dark Mode) -->
    <g transform="translate(25, 242)">
      <rect width="330" height="92" rx="18" fill="#1D221C"/>
      <circle cx="36" cy="46" r="24" fill="#4B1210"/>
      <path d="M36 34c-4.4 0-8 3.6-8 8 0 5.5 8 11 8 11s8-5.5 8-11c0-4.4-3.6-8-8-8z" fill="#FFB4AB"/>
      <text x="72" y="38" class="font" font-size="15" font-weight="700" fill="#E2E3DC">Fiddle Leaf Fig</text>
      <text x="72" y="55" class="font" font-size="12" fill="#939A8E">Balcony • Ficus lyrata</text>
      <g transform="translate(72, 64)">
        <path d="M4 1C4 1 0 5.5 0 8a4 4 0 008 0c0-2.5-4-7-4-7z" fill="#FFB4AB"/>
        <text x="14" y="9" class="font" font-size="12" font-weight="600" fill="#FFB4AB">Overdue by 2 days</text>
      </g>
      <circle cx="294" cy="46" r="18" fill="#283525"/>
      <path d="M294 39c0 0-4 4.8-4 7.2a4 4 0 008 0c0-2.4-4-7.2-4-7.2z" fill="#83D98A"/>
    </g>

    <!-- Card 3 (Dark Mode) -->
    <g transform="translate(25, 344)">
      <rect width="330" height="92" rx="18" fill="#1D221C"/>
      <circle cx="36" cy="46" r="24" fill="#283525"/>
      <path d="M36 34c-4.4 0-8 3.6-8 8 0 5.5 8 11 8 11s8-5.5 8-11c0-4.4-3.6-8-8-8z" fill="#83D98A"/>
      <text x="72" y="38" class="font" font-size="15" font-weight="700" fill="#E2E3DC">Snake Plant</text>
      <text x="72" y="55" class="font" font-size="12" fill="#939A8E">Bedroom • Sansevieria</text>
      <g transform="translate(72, 64)">
        <path d="M4 1C4 1 0 5.5 0 8a4 4 0 008 0c0-2.5-4-7-4-7z" fill="#83D98A"/>
        <text x="14" y="9" class="font" font-size="12" font-weight="600" fill="#83D98A">Water in 5 days</text>
      </g>
      <circle cx="294" cy="46" r="18" fill="#283525"/>
      <path d="M294 39c0 0-4 4.8-4 7.2a4 4 0 008 0c0-2.4-4-7.2-4-7.2z" fill="#83D98A"/>
    </g>

    <!-- Floating Action Button -->
    <g transform="translate(210, 570)">
      <rect width="135" height="48" rx="16" fill="#83D98A"/>
      <path d="M22 24h12M28 18v12" stroke="#003912" stroke-width="2.4" stroke-linecap="round"/>
      <text x="44" y="30" class="font" font-size="14" font-weight="700" fill="#003912">Add plant</text>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(13, 660)">
      <rect width="354" height="74" fill="#181D17"/>
      <line x1="0" y1="0" x2="354" y2="0" stroke="#262D24" stroke-width="1"/>

      <g transform="translate(48, 12)">
        <rect x="0" y="0" width="64" height="30" rx="15" fill="#2E432A"/>
        <path d="M32 8c-3 0-5 2.5-5 5.5 0 4 5 8.5 5 8.5s5-4.5 5-8.5c0-3-2-5.5-5-5.5z" fill="#83D98A"/>
        <text x="32" y="44" class="font" font-size="11" font-weight="700" fill="#E2E3DC" text-anchor="middle">My plants</text>
      </g>

      <g transform="translate(242, 12)">
        <circle cx="32" cy="15" r="7" fill="none" stroke="#939A8E" stroke-width="1.8"/>
        <path d="M30 22h4" stroke="#939A8E" stroke-width="1.8"/>
        <text x="32" y="44" class="font" font-size="11" font-weight="500" fill="#939A8E" text-anchor="middle">Care tips</text>
      </g>
    </g>

  </g>
</svg>
