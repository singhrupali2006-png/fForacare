<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.18"/>
    </filter>
    <filter id="fabShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Device Frame Outer -->
  <rect x="5" y="5" width="370" height="750" rx="42" fill="#1e1e1e" filter="url(#phoneShadow)"/>
  <!-- Bezel Border -->
  <rect x="7" y="7" width="366" height="746" rx="40" fill="none" stroke="#333333" stroke-width="2.5"/>

  <!-- Screen Canvas -->
  <g clip-path="url(#screenClip)">
    <clipPath id="screenClip">
      <rect x="13" y="13" width="354" height="734" rx="34"/>
    </clipPath>

    <!-- App Background (Light) -->
    <rect x="13" y="13" width="354" height="734" fill="#FBFDF8"/>

    <!-- Status Bar -->
    <g transform="translate(13, 13)">
      <!-- Camera punch hole -->
      <circle cx="177" cy="14" r="5" fill="#111111"/>
      <text x="32" y="18" class="font" font-size="12" font-weight="600" fill="#1B1C18">9:41</text>
      <!-- Signal, Wifi, Battery -->
      <g transform="translate(300, 8)" fill="#1B1C18">
        <path d="M1 8h2v3H1zm4-3h2v6H5zm4-3h2v9H9zm4-2h2v11h-2z"/>
        <path d="M22 2a11 11 0 00-7.8 3.2l7.8 9.5 7.8-9.5A11 11 0 0022 2z" transform="scale(0.8) translate(8, 0)"/>
        <rect x="30" y="3" width="16" height="8" rx="2" fill="none" stroke="#1B1C18" stroke-width="1.2"/>
        <rect x="32" y="5" width="11" height="4" rx="1" fill="#1B1C18"/>
        <path d="M47 5.5v3" stroke="#1B1C18" stroke-width="1.2"/>
      </g>
    </g>

    <!-- App Bar -->
    <g transform="translate(13, 46)">
      <!-- App Bar Background -->
      <rect x="0" y="0" width="354" height="54" fill="#FBFDF8"/>
      <!-- Icon + Title -->
      <g transform="translate(18, 14)">
        <path d="M12 2C6.5 2 2 6.5 2 12c0 6.6 10 12 10 12s10-5.4 10-12c0-5.5-4.5-10-10-10zm0 19.5C9.2 18.7 4 14.7 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8c0 2.7-5.2 6.7-8 9.5z" fill="#2E7D32"/>
        <path d="M12 5v10M12 9l-3 3M12 11l3 3" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/>
        <text x="30" y="18" class="font" font-size="20" font-weight="700" fill="#1B1C18">FloraCare</text>
      </g>
      <!-- Theme Switch Icon -->
      <circle cx="324" cy="27" r="16" fill="#F0F4EC"/>
      <path d="M324 20a7 7 0 000 14V20z" fill="#1B1C18"/>
      <circle cx="324" cy="27" r="7" fill="none" stroke="#1B1C18" stroke-width="1.5"/>
    </g>

    <!-- Section Header -->
    <text x="32" y="124" class="font" font-size="16" font-weight="600" fill="#BA1A1A">2 plants need water</text>

    <!-- Card 1: Monstera Deliciosa (Needs water today) -->
    <g transform="translate(25, 140)">
      <rect width="330" height="92" rx="18" fill="#F0F5EE"/>
      <!-- Avatar -->
      <circle cx="36" cy="46" r="24" fill="#FFDAD6"/>
      <!-- Plant icon -->
      <path d="M36 34c-4.4 0-8 3.6-8 8 0 5.5 8 11 8 11s8-5.5 8-11c0-4.4-3.6-8-8-8z" fill="#BA1A1A"/>
      <!-- Info -->
      <text x="72" y="38" class="font" font-size="15" font-weight="700" fill="#1B1C18">Monstera Deliciosa</text>
      <text x="72" y="55" class="font" font-size="12" fill="#44483E">Living Room • Swiss Cheese</text>
      <!-- Status -->
      <g transform="translate(72, 64)">
        <path d="M4 1C4 1 0 5.5 0 8a4 4 0 008 0c0-2.5-4-7-4-7z" fill="#BA1A1A"/>
        <text x="14" y="9" class="font" font-size="12" font-weight="600" fill="#BA1A1A">Water today</text>
      </g>
      <!-- Action Button -->
      <circle cx="294" cy="46" r="18" fill="#D8E7D7"/>
      <path d="M294 39c0 0-4 4.8-4 7.2a4 4 0 008 0c0-2.4-4-7.2-4-7.2z" fill="#1B5E20"/>
    </g>

    <!-- Card 2: Fiddle Leaf Fig (Overdue) -->
    <g transform="translate(25, 242)">
      <rect width="330" height="92" rx="18" fill="#F0F5EE"/>
      <circle cx="36" cy="46" r="24" fill="#FFDAD6"/>
      <path d="M36 34c-4.4 0-8 3.6-8 8 0 5.5 8 11 8 11s8-5.5 8-11c0-4.4-3.6-8-8-8z" fill="#BA1A1A"/>
      <text x="72" y="38" class="font" font-size="15" font-weight="700" fill="#1B1C18">Fiddle Leaf Fig</text>
      <text x="72" y="55" class="font" font-size="12" fill="#44483E">Balcony • Ficus lyrata</text>
      <g transform="translate(72, 64)">
        <path d="M4 1C4 1 0 5.5 0 8a4 4 0 008 0c0-2.5-4-7-4-7z" fill="#BA1A1A"/>
        <text x="14" y="9" class="font" font-size="12" font-weight="600" fill="#BA1A1A">Overdue by 2 days</text>
      </g>
      <circle cx="294" cy="46" r="18" fill="#D8E7D7"/>
      <path d="M294 39c0 0-4 4.8-4 7.2a4 4 0 008 0c0-2.4-4-7.2-4-7.2z" fill="#1B5E20"/>
    </g>

    <!-- Card 3: Snake Plant (Happy) -->
    <g transform="translate(25, 344)">
      <rect width="330" height="92" rx="18" fill="#F0F5EE"/>
      <circle cx="36" cy="46" r="24" fill="#D8E7D7"/>
      <path d="M36 34c-4.4 0-8 3.6-8 8 0 5.5 8 11 8 11s8-5.5 8-11c0-4.4-3.6-8-8-8z" fill="#2E7D32"/>
      <text x="72" y="38" class="font" font-size="15" font-weight="700" fill="#1B1C18">Snake Plant</text>
      <text x="72" y="55" class="font" font-size="12" fill="#44483E">Bedroom • Sansevieria</text>
      <g transform="translate(72, 64)">
        <path d="M4 1C4 1 0 5.5 0 8a4 4 0 008 0c0-2.5-4-7-4-7z" fill="#2E7D32"/>
        <text x="14" y="9" class="font" font-size="12" font-weight="600" fill="#2E7D32">Water in 5 days</text>
      </g>
      <circle cx="294" cy="46" r="18" fill="#D8E7D7"/>
      <path d="M294 39c0 0-4 4.8-4 7.2a4 4 0 008 0c0-2.4-4-7.2-4-7.2z" fill="#1B5E20"/>
    </g>

    <!-- Card 4: Peace Lily (Happy) -->
    <g transform="translate(25, 446)">
      <rect width="330" height="92" rx="18" fill="#F0F5EE"/>
      <circle cx="36" cy="46" r="24" fill="#D8E7D7"/>
      <path d="M36 34c-4.4 0-8 3.6-8 8 0 5.5 8 11 8 11s8-5.5 8-11c0-4.4-3.6-8-8-8z" fill="#2E7D32"/>
      <text x="72" y="38" class="font" font-size="15" font-weight="700" fill="#1B1C18">Peace Lily</text>
      <text x="72" y="55" class="font" font-size="12" fill="#44483E">Study Room • Spathiphyllum</text>
      <g transform="translate(72, 64)">
        <path d="M4 1C4 1 0 5.5 0 8a4 4 0 008 0c0-2.5-4-7-4-7z" fill="#2E7D32"/>
        <text x="14" y="9" class="font" font-size="12" font-weight="600" fill="#2E7D32">Water in 3 days</text>
      </g>
      <circle cx="294" cy="46" r="18" fill="#D8E7D7"/>
      <path d="M294 39c0 0-4 4.8-4 7.2a4 4 0 008 0c0-2.4-4-7.2-4-7.2z" fill="#1B5E20"/>
    </g>

    <!-- Floating Action Button (Add plant) -->
    <g transform="translate(210, 570)" filter="url(#fabShadow)">
      <rect width="135" height="48" rx="16" fill="#2E7D32"/>
      <!-- Add icon -->
      <path d="M22 24h12M28 18v12" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
      <text x="44" y="30" class="font" font-size="14" font-weight="600" fill="#FFFFFF">Add plant</text>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(13, 660)">
      <rect width="354" height="74" fill="#F0F4EC"/>
      <line x1="0" y1="0" x2="354" y2="0" stroke="#E1E4DD" stroke-width="1"/>

      <!-- Destination 1: My plants (Selected) -->
      <g transform="translate(48, 12)">
        <rect x="0" y="0" width="64" height="30" rx="15" fill="#D8E7D7"/>
        <!-- Yard icon -->
        <path d="M32 8c-3 0-5 2.5-5 5.5 0 4 5 8.5 5 8.5s5-4.5 5-8.5c0-3-2-5.5-5-5.5z" fill="#1B5E20"/>
        <text x="32" y="44" class="font" font-size="11" font-weight="700" fill="#1B1C18" text-anchor="middle">My plants</text>
      </g>

      <!-- Destination 2: Care tips -->
      <g transform="translate(242, 12)">
        <!-- Lightbulb outline -->
        <circle cx="32" cy="15" r="7" fill="none" stroke="#44483E" stroke-width="1.8"/>
        <path d="M30 22h4" stroke="#44483E" stroke-width="1.8"/>
        <text x="32" y="44" class="font" font-size="11" font-weight="500" fill="#44483E" text-anchor="middle">Care tips</text>
      </g>
    </g>
  </g>
</svg>
